<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>单摆仿真 · Pendulum Simulation</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #1a1a24;
  }
  body {
    display: flex;
    flex-direction: column;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }

  /* 画布区：占据除控制面板外的全部高度 */
  #stageWrap {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;          /* 允许 flex 子项收缩，否则会被内容顶高 */
    overflow: hidden;
  }
  #stage {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* 控制面板：画布下方，深色质感延续 */
  #panel {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 26px;
    box-sizing: border-box;
    padding: 13px 22px 15px;
    background: #16161f;
    border-top: 1px solid rgba(110, 210, 255, 0.18);
    color: #cddaf0;
    font-size: 13px;
  }
  .ctrl {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .ctrl > label {
    color: #96a8c4;
    white-space: nowrap;
  }
  .ctrl > input[type="range"] {
    width: 152px;
    height: 20px;
    margin: 0;
    accent-color: #7fd8ff;
    cursor: pointer;
  }
  .ctrl > output {
    min-width: 122px;
    text-align: right;
    font-family: Consolas, "SF Mono", Menlo, monospace;
    color: #eafcff;
  }
  #btnReset {
    margin-left: auto;
    padding: 8px 20px;
    border-radius: 8px;
    border: 1px solid rgba(110, 210, 255, 0.45);
    background: rgba(110, 210, 255, 0.10);
    color: #cdeeff;
    font-family: inherit;
    font-size: 13px;
    line-height: 1.2;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  #btnReset:hover {
    background: rgba(110, 210, 255, 0.20);
    border-color: rgba(110, 210, 255, 0.70);
  }
  #btnReset:active {
    background: rgba(110, 210, 255, 0.30);
  }
  #btnReset:focus-visible,
  .ctrl > input[type="range"]:focus-visible {
    outline: 2px solid rgba(110, 210, 255, 0.75);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<div id="stageWrap">
  <canvas id="stage"></canvas>
</div>

<div id="panel">
  <div class="ctrl">
    <label for="rangeLen">摆长 L</label>
    <input id="rangeLen" type="range" min="100" max="350" step="1" value="200">
    <output id="outLen" for="rangeLen">200 px (2.00 m)</output>
  </div>

  <div class="ctrl">
    <label for="rangeG">重力 g</label>
    <input id="rangeG" type="range" min="1" max="25" step="0.1" value="9.8">
    <output id="outG" for="rangeG">9.80 m/s²</output>
  </div>

  <div class="ctrl">
    <label for="rangeC">阻尼 c</label>
    <input id="rangeC" type="range" min="0" max="0.01" step="0.0002" value="0">
    <output id="outC" for="rangeC">0.0000</output>
  </div>

  <button id="btnReset" type="button">重置摆动</button>
</div>

<script>
"use strict";

/* ============================================================
   1. 参数
   ------------------------------------------------------------
   约束给定的初始量：摆长 L = 200px、重力 g = 9.8、初始摆角 45°。
   但"200 像素"与"9.8 m/s²"不在同一量纲，无法直接代入周期公式
   T = 2π√(L/g)。因此引入比例尺 PX_PER_METER 把像素换算成米：
       L_m = L_px / PX_PER_METER = 200 / 100 = 2.00 m
       T₀  = 2π√(2.00 / 9.8)     ≈ 2.838 s
   这样既保留了约束要求的绘制长度 200px，又让物理量纲自洽。

   以下参数均可由界面滑块实时调整，物理层每步读取最新值，
   因此拖动滑块时模拟立即响应，无需重启。
   ============================================================ */
const PX_PER_METER = 100;          // 比例尺：100 像素 = 1 米
const THETA0_DEG   = 45;           // 初始摆角（度）

const params = {
  L:       200,   // 摆长（像素），滑块范围 100 ~ 350
  g:       9.8,   // 重力加速度（m/s²），滑块范围 1 ~ 25
  damping: 0      // 阻尼系数 c，方程 θ'' = -(g/L)·sinθ - c·θ'
};

/* —— 由参数派生的物理量（每帧重算，保证滑块一变就同步） —— */
function armMeters()   { return params.L / PX_PER_METER; }
function omega0()      { return Math.sqrt(params.g / armMeters()); }
function periodRef()   { return 2 * Math.PI / omega0(); }        // 无阻尼参考周期
function dampingRatio(){ return params.damping / (2 * omega0()); } // 阻尼比 ζ
function decayTau()    { return params.damping > 0 ? 2 / params.damping : Infinity; }

const COLORS = {
  bg:        "#1a1a24",   // 深灰科技色（约束指定）
  grid:      "rgba(140, 170, 220, 0.045)",
  rod:       "rgba(150, 200, 240, 0.55)",
  reference: "rgba(150, 200, 240, 0.16)",
  arc:       "rgba(110, 210, 255, 0.50)",
  trail:     "110, 210, 255",
  bobCore:   "#eafcff",
  bobMid:    "#7fd8ff",
  bobEdge:   "#1d6fa8",
  glow:      "rgba(110, 210, 255, 0.85)",
  text:      "rgba(205, 218, 240, 0.92)",
  textDim:   "rgba(150, 168, 196, 0.75)"
};

/* ============================================================
   2. 状态
   ============================================================ */
const state = {
  theta: THETA0_DEG * Math.PI / 180,  // 摆角（弧度），自竖直向下方向量起
  omega: 0,                            // 角速度（rad/s）
  t: 0,                                // 仿真时间（s）
  trail: []                            // 摆角历史，用于绘制运动拖尾
};
const TRAIL_MAX = 110;

/* 复位：摆球精准回到 45° 初始状态（参数与滑块保持不变） */
function resetPendulum() {
  state.theta = THETA0_DEG * Math.PI / 180;
  state.omega = 0;
  state.t = 0;
  state.trail.length = 0;
  accumulator = 0;
}

/* ============================================================
   3. 画布初始化（含高分屏适配）
   ------------------------------------------------------------
   画布尺寸取自其 CSS 布局尺寸（由 flex 决定），不再写死为
   视口大小，这样控制面板出现后画布会自动占满剩余空间。
   ============================================================ */
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d", { alpha: false });
let dpr = 1, VW = 0, VH = 0;

function resize() {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  if (!w || !h) return;                              // 布局尚未就绪时跳过
  dpr = Math.min(window.devicePixelRatio || 1, 2);   // 上限 2，兼顾清晰与性能
  VW = w;
  VH = h;
  canvas.width  = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
}

window.addEventListener("resize", resize);
if (typeof ResizeObserver !== "undefined") {
  // 面板换行、字体加载等导致画布尺寸变化时也能跟上
  new ResizeObserver(resize).observe(canvas);
}
resize();

/* 悬点位置：随画布高度与摆长自适应，保证摆球尽量留在画面内 */
function pivotOf() {
  const x = VW / 2;
  const y = Math.max(32, Math.min(VH * 0.22, VH - params.L - 46));
  return { x, y };
}

/* ============================================================
   4. 物理积分：θ'' = -(g / L) · sin θ - c · θ'
   ------------------------------------------------------------
   使用经典四阶龙格-库塔（RK4）。相比显式欧拉法，RK4 在
   45° 这种大摆角下不会持续累积能量，长期摆动幅度保持稳定。
   阻尼项 -c·θ' 直接并入导数，各中间级同步计算，保证精度。
   ============================================================ */
function integrateRK4(theta, omega, dt) {
  const k = params.g / armMeters();
  const c = params.damping;

  const k1t = omega;
  const k1o = -k * Math.sin(theta) - c * omega;

  const t2 = theta + 0.5 * dt * k1t;
  const o2 = omega + 0.5 * dt * k1o;
  const k2t = o2;
  const k2o = -k * Math.sin(t2) - c * o2;

  const t3 = theta + 0.5 * dt * k2t;
  const o3 = omega + 0.5 * dt * k2o;
  const k3t = o3;
  const k3o = -k * Math.sin(t3) - c * o3;

  const t4 = theta + dt * k3t;
  const o4 = omega + dt * k3o;
  const k4t = o4;
  const k4o = -k * Math.sin(t4) - c * o4;

  return [
    theta + (dt / 6) * (k1t + 2 * k2t + 2 * k3t + k4t),
    omega + (dt / 6) * (k1o + 2 * k2o + 2 * k3o + k4o)
  ];
}

const FIXED_DT = 1 / 480;   // 固定物理步长，保证不同帧率下结果一致
let accumulator = 0;

function stepPhysics(frameDt) {
  accumulator += frameDt;
  let guard = 0;
  while (accumulator >= FIXED_DT && guard++ < 480) {
    const [th, om] = integrateRK4(state.theta, state.omega, FIXED_DT);
    state.theta = th;
    state.omega = om;
    state.t += FIXED_DT;
    accumulator -= FIXED_DT;
  }
  if (guard >= 480) accumulator = 0;   // 防止长时间切后台后追帧爆炸

  state.trail.push(state.theta);
  if (state.trail.length > TRAIL_MAX) state.trail.shift();
}

/* 单位质量机械能（m = 1）：E = ½(Lω)² + gL(1 - cosθ)
   无阻尼时该值应恒定，是校验积分器正确性的直接指标；
   开启阻尼后它会单调下降，正好直观反映能量耗散 */
function energyPerMass() {
  const Lm = armMeters();
  const v = Lm * state.omega;
  return 0.5 * v * v + params.g * Lm * (1 - Math.cos(state.theta));
}

/* ============================================================
   5. 绘制
   ============================================================ */
function drawBackground() {
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, VW, VH);

  // 极淡网格，营造科技感但不抢主体
  ctx.strokeStyle = COLORS.grid;
  ctx.lineWidth = 1;
  const gap = 40;
  ctx.beginPath();
  for (let x = (VW / 2) % gap; x < VW; x += gap) {
    ctx.moveTo(Math.round(x) + 0.5, 0);
    ctx.lineTo(Math.round(x) + 0.5, VH);
  }
  for (let y = (VH / 2) % gap; y < VH; y += gap) {
    ctx.moveTo(0, Math.round(y) + 0.5);
    ctx.lineTo(VW, Math.round(y) + 0.5);
  }
  ctx.stroke();

  // 暗角，让视线聚焦到中心
  const vig = ctx.createRadialGradient(
    VW / 2, VH * 0.45, Math.min(VW, VH) * 0.15,
    VW / 2, VH * 0.45, Math.max(VW, VH) * 0.78
  );
  vig.addColorStop(0, "rgba(0, 0, 0, 0)");
  vig.addColorStop(1, "rgba(0, 0, 0, 0.42)");
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, VW, VH);
}

function drawTrail(px, py) {
  const n = state.trail.length;
  if (n < 2) return;
  const L = params.L;
  ctx.lineCap = "round";
  for (let i = 1; i < n; i++) {
    const a = state.trail[i - 1];
    const b = state.trail[i];
    const prog = i / n;                       // 越新的轨迹越亮
    ctx.strokeStyle = "rgba(" + COLORS.trail + ", " + (prog * prog * 0.42).toFixed(3) + ")";
    ctx.lineWidth = 0.6 + prog * 2.2;
    ctx.beginPath();
    ctx.moveTo(px + L * Math.sin(a), py + L * Math.cos(a));
    ctx.lineTo(px + L * Math.sin(b), py + L * Math.cos(b));
    ctx.stroke();
  }
}

function drawReference(px, py) {
  // 竖直参考线（摆角为零的方向）
  ctx.save();
  ctx.setLineDash([5, 7]);
  ctx.strokeStyle = COLORS.reference;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(px + 0.5, py);
  ctx.lineTo(px + 0.5, py + params.L + 26);
  ctx.stroke();
  ctx.restore();

  // 角位移圆弧
  const r = 62;
  const start = Math.PI / 2;
  const end = start - state.theta;
  ctx.save();
  ctx.strokeStyle = COLORS.arc;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.arc(px, py, r, Math.min(start, end), Math.max(start, end));
  ctx.stroke();
  ctx.restore();

  // 角度数值
  ctx.fillStyle = COLORS.textDim;
  ctx.font = "12px Consolas, 'SF Mono', Menlo, monospace";
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  const mid = start - state.theta / 2;
  ctx.fillText(
    (state.theta * 180 / Math.PI).toFixed(1) + "\u00B0",
    px + (r + 8) * Math.cos(mid),
    py + (r + 8) * Math.sin(mid)
  );
}

function drawRod(px, py, bx, by) {
  ctx.save();
  ctx.strokeStyle = COLORS.rod;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(bx, by);
  ctx.stroke();
  ctx.restore();
}

function drawPivot(px, py) {
  ctx.save();
  ctx.fillStyle = "rgba(150, 200, 240, 0.30)";
  ctx.strokeStyle = "rgba(150, 200, 240, 0.55)";
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(px, py, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = COLORS.bobMid;
  ctx.beginPath();
  ctx.arc(px, py, 2.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawBob(bx, by) {
  const R = 15;

  // 外层柔光晕：径向渐变叠加，比单纯 shadowBlur 更均匀
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  const halo = ctx.createRadialGradient(bx, by, R * 0.5, bx, by, R * 3.0);
  halo.addColorStop(0, "rgba(110, 210, 255, 0.15)");
  halo.addColorStop(0.45, "rgba(110, 210, 255, 0.05)");
  halo.addColorStop(1, "rgba(110, 210, 255, 0)");
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(bx, by, R * 3.0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 摆球本体
  ctx.save();
  ctx.shadowColor = COLORS.glow;
  ctx.shadowBlur = 16;
  const body = ctx.createRadialGradient(
    bx - R * 0.34, by - R * 0.38, R * 0.08,
    bx, by, R
  );
  body.addColorStop(0,    COLORS.bobCore);
  body.addColorStop(0.34, COLORS.bobMid);
  body.addColorStop(1,    COLORS.bobEdge);
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.arc(bx, by, R, 0, Math.PI * 2);
  ctx.fill();

  // 二次发光，强化"微弱发光"的层次
  ctx.shadowBlur = 26;
  ctx.globalAlpha = 0.28;
  ctx.fill();
  ctx.restore();

  // 高光点
  ctx.save();
  ctx.fillStyle = "rgba(255, 255, 255, 0.55)";
  ctx.beginPath();
  ctx.arc(bx - R * 0.32, by - R * 0.38, R * 0.19, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawHUD() {
  const thetaDeg = state.theta * 180 / Math.PI;
  const tau = decayTau();
  const rows = [
    ["摆长 L",      params.L + " px  (" + armMeters().toFixed(2) + " m)"],
    ["重力 g",      params.g.toFixed(2) + " m/s²"],
    ["阻尼 c",      params.damping.toFixed(4)],
    ["阻尼比 ζ",    dampingRatio().toFixed(4)],
    ["摆角 θ",      (thetaDeg >= 0 ? "+" : "") + thetaDeg.toFixed(1) + "°"],
    ["角速度 ω",    (state.omega >= 0 ? "+" : "") + state.omega.toFixed(3) + " rad/s"],
    ["周期 T₀",     periodRef().toFixed(3) + " s"],
    ["衰减时间 τ",  tau === Infinity ? "∞" : tau.toFixed(1) + " s"],
    ["机械能 E",    energyPerMass().toFixed(3) + " J/kg"],
    ["仿真时间 t",  state.t.toFixed(1) + " s"]
  ];

  const padX = 16, padY = 14, rowH = 19, titleH = 26;
  let maxW = 232;
  ctx.save();
  ctx.font = "600 13px 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif";
  maxW = Math.max(maxW, ctx.measureText("Pendulum Simulation").width + padX * 2);
  for (const key of ["角速度 ω", "衰减时间 τ", "机械能 E", "阻尼比 ζ"]) {
    maxW = Math.max(maxW, ctx.measureText(key).width + 100);
  }
  ctx.restore();

  const W = maxW;
  const H = titleH + rows.length * rowH + padY * 2 - 4;
  const x = 22, y = 22;

  ctx.save();
  // 面板
  ctx.fillStyle = "rgba(26, 26, 36, 0.78)";
  ctx.strokeStyle = "rgba(110, 210, 255, 0.20)";
  ctx.lineWidth = 1;
  roundRect(x, y, W, H, 10);
  ctx.fill();
  ctx.stroke();

  // 标题
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  ctx.fillStyle = COLORS.text;
  ctx.font = "600 13px 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif";
  ctx.fillText("Pendulum Simulation", x + padX, y + padY + 6);

  // 分隔线
  ctx.strokeStyle = "rgba(110, 210, 255, 0.14)";
  ctx.beginPath();
  ctx.moveTo(x + padX, y + padY + titleH - 4);
  ctx.lineTo(x + W - padX, y + padY + titleH - 4);
  ctx.stroke();

  // 数据行
  let ry = y + padY + titleH + 9;
  for (const [key, val] of rows) {
    ctx.font = "12px 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif";
    ctx.fillStyle = COLORS.textDim;
    ctx.fillText(key, x + padX, ry);
    ctx.font = "12px Consolas, 'SF Mono', Menlo, monospace";
    ctx.fillStyle = COLORS.text;
    ctx.textAlign = "right";
    ctx.fillText(val, x + W - padX, ry);
    ctx.textAlign = "left";
    ry += rowH;
  }
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const { x: px, y: py } = pivotOf();
  const L = params.L;
  const bx = px + L * Math.sin(state.theta);
  const by = py + L * Math.cos(state.theta);

  drawBackground();
  drawTrail(px, py);
  drawReference(px, py);
  drawRod(px, py, bx, by);
  drawBob(bx, by);
  drawPivot(px, py);
  drawHUD();
}

/* ============================================================
   6. 控制面板绑定
   ------------------------------------------------------------
   滑块只改 params，物理层下一步即读取新值，故响应是实时的。
   复位按钮只重置摆球运动状态，保留用户当前的参数设置。
   ============================================================ */
const elLen   = document.getElementById("rangeLen");
const elG     = document.getElementById("rangeG");
const elC     = document.getElementById("rangeC");
const outLen  = document.getElementById("outLen");
const outG    = document.getElementById("outG");
const outC    = document.getElementById("outC");
const btnReset = document.getElementById("btnReset");

function syncControlLabels() {
  outLen.value = params.L + " px (" + armMeters().toFixed(2) + " m)";
  outG.value = params.g.toFixed(2) + " m/s²";
  outC.value = params.damping.toFixed(4);
}

function applyControls() {
  params.L       = Number(elLen.value);
  params.g       = Number(elG.value);
  params.damping = Number(elC.value);
  syncControlLabels();
}

elLen.addEventListener("input", applyControls);
elG.addEventListener("input", applyControls);
elC.addEventListener("input", applyControls);
btnReset.addEventListener("click", resetPendulum);

/* 初始化：让 params 与 HTML 中滑块的 value 保持一致 */
elLen.value = params.L;
elG.value   = params.g;
elC.value   = params.damping;
applyControls();

/* ============================================================
   7. 主循环：requestAnimationFrame 驱动
   ============================================================ */
let lastTs = 0;

function loop(ts) {
  if (!lastTs) lastTs = ts;
  // 帧间隔限幅：避免切后台再切回时物理瞬间"跳跃"
  const frameDt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;

  stepPhysics(frameDt);
  render();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
